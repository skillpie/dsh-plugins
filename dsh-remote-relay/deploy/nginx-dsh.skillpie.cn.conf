# dsh.skillpie.cn 站点配置 —— drop-in 到服务器 /etc/nginx/conf.d/
# 范式与 zcode.skillpie.cn.conf 一致：SSL 参数按服务器现有配置等值复制，不能 include
# skillpie_common.conf（其 location / 与本反代冲突）。
#
# DSH Web（docs/user/guide/public-deployments.zh.md）的反代硬约束：
# - 根路径挂载：无前缀剥离、无 cookie Path 改写，最简形态
# - Host 必须原样转发：dsh 的 browser-trust 栅栏按收到的 Host 与
#   --trusted-host dsh.skillpie.cn 比对，改写 Host 会导致全部 API 403
# - WebSocket 升级头必须透传（页面所有请求与流式响应都走 WS）
# - 后端明文 HTTP 签发的 cookie 无 Secure 标记：服务器 nginx 不支持 proxy_cookie_flags
#   指令（2026-11-09 实测 nginx -t 报 invalid parameter "secure"），HTTPS 链路上
#   host-only cookie 可正常携带与回传，仅少了防明文泄漏的纵深防御

map $http_upgrade $dsh_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream dsh_web {
    server 127.0.0.1:3080;
}

server {
    listen 80;
    server_name dsh.skillpie.cn;

    location /nginx-health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name dsh.skillpie.cn;

    # 复用服务器上已有的 skillpie.cn 证书（与 zcode.skillpie.cn.conf 同源）
    ssl_certificate /etc/nginx/ssl/skillpie.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/skillpie.cn.key;

    # —— 与 skillpie_common.conf 等值的 SSL 参数（无法 include，见文件头注释）——
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    client_max_body_size 100M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # 根路径不再暴露 DSH 部署内容：记住最后访问的 8 位远程码并自动跳回，或提供码输入页
    location = / {
        root /var/www/dsh-remote-relay-root;
        try_files /index.html =404;
    }

    # 未知远程码兜底:裸 8 位码路径(仅 /<code> 与 /<code>/)后端 404 时改写为输码页。
    # 只匹配裸码路径,不碰 /<code>/api/* 等更深路径,避免吞掉隧道内资源 404。
    location ~ "^/[1-9][0-9]{7}/?$" {
        proxy_pass http://dsh_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        error_page 404 = @dsh_remote_enter;
        proxy_intercept_errors on;
    }

    location @dsh_remote_enter {
        rewrite '^/([1-9][0-9]{7})(/.*)?$' /dsh-remote-relay-enter?code=$1 break;
        proxy_pass http://dsh_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://dsh_web;
        proxy_http_version 1.1;
        # 栅栏按 Host 鉴权（docs/user/guide/public-deployments.zh.md），必须原样转发
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # WebSocket 升级透传
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dsh_connection_upgrade;
        # 流式响应与长连接 WS：关缓冲、放宽超时
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
