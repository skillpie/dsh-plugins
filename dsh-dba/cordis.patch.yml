# dsh-dba bundle patch.
#
# `dsh plugin --profile <name> add dsh-dba` reads this file and appends the
# row below to the profile's bundle stack. The `name` is the npm package name,
# so Node module resolution finds the installed package.
- insert:
    - id: dba
      name: "@skillpie/dsh-dba"
      config:
        demo: true
        allowWrite: true
