<svg width="512" height="512" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F6BFF"/>
      <stop offset="100%" stop-color="#22C3A6"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="clockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="180" height="180" rx="40" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- 日报纸张 -->
  <g filter="url(#shadow)">
    <rect x="46" y="34" width="94" height="116" rx="12" fill="url(#paperGrad)"/>
  </g>
  <rect x="60" y="52" width="52" height="10" rx="5" fill="#2F6BFF" opacity="0.85"/>
  <rect x="60" y="74" width="66" height="7" rx="3.5" fill="#8aa2c8"/>
  <rect x="60" y="90" width="66" height="7" rx="3.5" fill="#8aa2c8"/>
  <rect x="60" y="106" width="46" height="7" rx="3.5" fill="#8aa2c8"/>
  <rect x="60" y="126" width="60" height="7" rx="3.5" fill="#22C3A6"/>

  <!-- 时钟徽标 -->
  <g transform="translate(136, 136)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="26" fill="url(#clockGrad)"/>
    <circle cx="0" cy="0" r="20" fill="#ffffff"/>
    <rect x="-2.5" y="-13" width="5" height="14" rx="2.5" fill="#1f2937"/>
    <rect x="0" y="-2.5" width="11" height="5" rx="2.5" fill="#1f2937"/>
  </g>
</svg>
