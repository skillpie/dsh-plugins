# 每日富化精选插件目录:join awesome-dsh-plugin 官方目录(stars/下载量/截图/简介),
# 未收录条目退化直连 npm / GitHub 探测。有变更则自动提交到 main。
name: enrich-plugins
on:
  schedule:
    - cron: '0 3 * * *' # 每天 11:00 北京时间
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node dsh-plugins-plugin/scripts/enrich.mjs
      - name: commit if changed
        run: |
          if [ -n "$(git status --porcelain dsh-plugins-plugin/plugins.json)" ]; then
            git config user.name "enrich-bot"
            git config user.email "actions@users.noreply.github.com"
            git add dsh-plugins-plugin/plugins.json
            git commit -m "chore: 富化精选插件目录(stars/下载量/截图)"
            git push
          fi
