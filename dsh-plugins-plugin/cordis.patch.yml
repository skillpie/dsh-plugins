# dsh-plugins-plugin bundle patch.
#
# One dual-face row: the host half provides the `featured-plugins` registry
# service (other plugins register their featured lists through it) and serves
# GET /dsh-plugins-plugin/featured (the aggregated list); the client half
# registers the「精选插件」tab on the official Plugins page.
- insert:
    - id: dsh-plugins-plugin
      name: "dsh-plugins-plugin"
      config: {}
